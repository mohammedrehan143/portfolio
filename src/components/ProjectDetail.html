<!-- Component: Project Detail Drawer & Hover Preview Overlays -->
<div class="proj-preview" id="proj-preview">
  <div class="proj-card" id="proj-card">
    <div class="proj-meta">
      <span class="proj-date" id="proj-date">01 2025</span>
      <span class="proj-label">Preview</span>
    </div>
    <img id="proj-cover" src="/assets/images/projects/Covers/evflow.jpg" alt="" width="1333" height="1000">
  </div>
</div>
<div class="proj-cursor" id="proj-cursor">See project</div>

<div class="page-fade" id="page-fade"></div>
<div class="flying-title" id="flying-title"></div>
<div class="work-transition-overlay" id="work-transition-overlay"></div>
<div class="work-flying-text" id="work-flying-text">Work</div>

<section class="project-detail" id="project-detail">
  <div class="detail-back chr-hover" id="detail-back" data-chr="🡼BACK" data-i18n-attr="data-chr:index.detail.back"></div>
  <div class="detail-info">
    <div class="detail-title-wrap" id="detail-title-wrap">
      <h1 class="detail-title" id="detail-title"></h1>
      <span class="detail-year" id="detail-year"></span>
    </div>
    <p class="detail-desc" id="detail-desc"></p>
    <div class="detail-tags" id="detail-tags"></div>
    <div class="detail-link-wrap" id="detail-link-wrap" style="opacity: 0; margin-top: 2.5rem; display: none;">
      <a class="detail-link-btn chr-hover" id="detail-link-btn" href="#" target="_blank" rel="noopener noreferrer" data-chr="Live Demo 🡥" style="display: none; margin-right: 0.8rem; margin-bottom: 0.5rem;">Live Demo 🡥</a>
      <a class="detail-link-btn chr-hover" id="detail-github-btn" href="#" target="_blank" rel="noopener noreferrer" data-chr="GitHub Repo 🡥" style="display: none; margin-bottom: 0.5rem;">GitHub Repo 🡥</a>
    </div>
  </div>
  <div class="detail-gallery-wrap" id="detail-gallery-wrap">
    <div class="detail-thumbs" id="detail-thumbs">
      <div class="detail-thumbs-inner" id="detail-thumbs-inner"></div>
    </div>
    <div class="detail-selected" id="detail-selected"></div>
  </div>
</section>
